# RustDroid IDE Gradle settings
# R4A (auditoría M10): R8 sobre el SDK de Anthropic necesita más memoria
# (con 1,5 GB el daemon se quedaba sin memoria)
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# Non-transitive R classes (faster builds, smaller R)
android.nonTransitiveRClass=true

# Kotlin daemon memory (sandboxed/CI-friendly)
kotlin.daemon.jvmargs=-Xmx1024m

# Do not fail on missing update servers
android.suppressUnsupportedCompileSdk=35
